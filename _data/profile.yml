bio: I can't sit still, so I keep chasing the next thing to learn. I started out working on chips at NVIDIA, then went to Penn for robotics, where my team won first place and $10,000 with a trash-collecting robot and I helped invent a smart toy for infants. After building robots for rough terrain at Milwaukee Tool, I'm now at Luminous Robotics, working on robots that install solar panels.
